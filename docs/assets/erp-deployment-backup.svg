<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <filter id="sd" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .h{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .card{fill:white;stroke:#ccfbf1;filter:url(#sd)}
      .line{stroke:#0891b2;stroke-width:3;fill:none;marker-end:url(#arrd)}
      .disk{fill:#0f766e}
    </style>
    <marker id="arrd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker>
  </defs>
  <rect width="1400" height="640" rx="30" fill="url(#bgd)"/>
  <text x="60" y="70" class="title">本地私有化部署与硬盘归档方案</text>
  <text x="60" y="104" class="sub">系统、数据库、附件、导出文件和备份包均落在客户本地环境，支持冷备份与物理硬盘归档</text>
  <rect class="card" x="80" y="165" width="270" height="260" rx="24"/>
  <text x="115" y="210" class="h">局域网访问</text>
  <text x="115" y="250" class="t">销售、内勤、生产、仓库</text>
  <text x="115" y="283" class="t">采购、品控、财务、管理层</text>
  <text x="115" y="316" class="t">浏览器访问本地服务器</text>
  <text x="115" y="349" class="t">管理层远程访问可走 VPN</text>
  <path class="line" d="M350 295 H475"/>
  <rect class="card" x="475" y="135" width="300" height="320" rx="24"/>
  <text x="510" y="180" class="h">本地 ERP 服务器</text>
  <text x="510" y="220" class="t">应用服务</text>
  <text x="510" y="253" class="t">PostgreSQL 数据库服务</text>
  <text x="510" y="286" class="t">导入导出服务</text>
  <text x="510" y="319" class="t">备份恢复工具</text>
  <text x="510" y="352" class="t">审计日志与权限校验</text>
  <path class="line" d="M775 295 H900"/>
  <rect class="card" x="900" y="115" width="385" height="365" rx="24"/>
  <text x="935" y="160" class="h">指定物理数据盘</text>
  <rect x="940" y="190" width="120" height="54" rx="14" class="disk"/>
  <text x="1000" y="224" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:white">PGDATA</text>
  <rect x="1080" y="190" width="150" height="54" rx="14" fill="#0891b2"/>
  <text x="1155" y="224" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:white">attachments</text>
  <rect x="940" y="265" width="120" height="54" rx="14" fill="#2563eb"/>
  <text x="1000" y="299" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:white">exports</text>
  <rect x="1080" y="265" width="150" height="54" rx="14" fill="#7c3aed"/>
  <text x="1155" y="299" text-anchor="middle" style="font:700 15px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:white">backups</text>
  <text x="935" y="365" class="t">一键冷备份：数据库 + 附件 + 导出文件 + manifest</text>
  <text x="935" y="398" class="t">更换硬盘：旧盘封存，新盘恢复近期活动数据</text>
  <path class="line" d="M1092 480 C1092 535 980 545 900 545"/>
  <rect x="520" y="510" width="380" height="64" rx="22" fill="#0f172a"/>
  <text x="710" y="550" text-anchor="middle" style="font:700 17px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:white">公司经营数据资产物理私有、可备份、可恢复、可归档</text>
</svg>
