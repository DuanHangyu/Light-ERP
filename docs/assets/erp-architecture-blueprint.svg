<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <linearGradient id="bga" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="sha" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      .title{font:700 32px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .sub{font:400 16px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}
      .h{font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .t{font:400 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}
      .card{fill:white;stroke:#dbeafe;filter:url(#sha)}
      .dark{fill:#0f172a}
      .link{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#arra)}
    </style>
    <marker id="arra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1400" height="720" rx="32" fill="url(#bga)"/>
  <text x="60" y="70" class="title">正式产品技术架构蓝图</text>
  <text x="60" y="104" class="sub">以本地化部署为基础，采用标准 Web 应用、生产级 PostgreSQL、角色权限、审计日志和完整备份体系</text>
  <rect class="card" x="80" y="160" width="250" height="390" rx="24"/>
  <text x="115" y="205" class="h">访问端</text>
  <text x="115" y="245" class="t">员工办公电脑</text>
  <text x="115" y="278" class="t">管理层大屏/电脑</text>
  <text x="115" y="311" class="t">VPN 可选远程访问</text>
  <text x="115" y="344" class="t">浏览器访问，无需安装客户端</text>
  <path class="link" d="M330 355 H470"/>
  <rect class="card" x="470" y="135" width="315" height="440" rx="26"/>
  <text x="505" y="180" class="h">应用服务层</text>
  <text x="505" y="220" class="t">Next.js / TypeScript</text>
  <text x="505" y="253" class="t">服务端 API</text>
  <text x="505" y="286" class="t">业务动作编排</text>
  <text x="505" y="319" class="t">RBAC 权限校验</text>
  <text x="505" y="352" class="t">单据状态校验</text>
  <text x="505" y="385" class="t">库存与财务事务</text>
  <text x="505" y="418" class="t">导入导出服务</text>
  <text x="505" y="451" class="t">审计日志写入</text>
  <path class="link" d="M785 260 H915"/>
  <path class="link" d="M785 390 H915"/>
  <rect class="card" x="915" y="135" width="390" height="190" rx="24"/>
  <text x="950" y="180" class="h">PostgreSQL 生产数据库</text>
  <text x="950" y="220" class="t">订单、库存、批次、BOM、质检</text>
  <text x="950" y="253" class="t">应收应付、审批、配方试算</text>
  <text x="950" y="286" class="t">主外键、索引、事务、备份策略</text>
  <rect class="card" x="915" y="375" width="390" height="180" rx="24"/>
  <text x="950" y="420" class="h">本地文件与备份存储</text>
  <text x="950" y="460" class="t">附件、BOM 模板、检验报告</text>
  <text x="950" y="493" class="t">报价单、送货单、报表导出</text>
  <text x="950" y="526" class="t">冷备份包、manifest、恢复脚本</text>
  <rect class="dark" x="470" y="615" width="835" height="48" rx="24"/>
  <text x="888" y="646" text-anchor="middle" style="font:600 16px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:white">安全基线：局域网部署 / VPN 可选 / 最小权限 / 操作留痕 / 数据盘物理私有</text>
</svg>
